apply plugin: 'com.android.application'
android {
    namespace 'cn.arch.dmr'
    compileSdk 34
    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 616
        versionName "3.2.84"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    flavorDimensions "edition"
    productFlavors {
        association {
            dimension "edition"
            applicationId "cn.arch.dmr"
            versionCode 691
            versionName "3.2.172-ASSOCIATION"
            manifestPlaceholders = [appLabel: "ARCH协会版"]
            buildConfigField "boolean", "PUBLIC_EDITION", "false"
            buildConfigField "boolean", "HYTERA_EDITION", "false"
            buildConfigField "boolean", "OVERSEAS_EDITION", "false"
            buildConfigField "String", "APP_DISPLAY_TITLE", '"ARCH协会版"'
            buildConfigField "String", "APP_EDITION_LABEL", '"协会版"'
            buildConfigField "String", "DISPLAY_VERSION_LABEL", '"3.2.172（协会版）"'
            buildConfigField "String", "UPDATE_VERSION_URL", '"https://hljrsa.cn:50113/releases/ota/arch-association-version.json"'
            buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://hljrsa.cn:50113/releases/ota/arch-association-version.json"'
        }
        publicEdition {
            dimension "edition"
            applicationId "cn.arch.dmr.public"
            versionCode 674
            versionName "3.2.156-PUBLIC"
            manifestPlaceholders = [appLabel: "ARCH"]
            buildConfigField "boolean", "PUBLIC_EDITION", "true"
            buildConfigField "boolean", "HYTERA_EDITION", "false"
            buildConfigField "boolean", "OVERSEAS_EDITION", "false"
            buildConfigField "String", "APP_DISPLAY_TITLE", '"业余无线电融合中枢"'
            buildConfigField "String", "APP_EDITION_LABEL", '"公开版"'
            buildConfigField "String", "DISPLAY_VERSION_LABEL", '"3.2.156（公开版）"'
            buildConfigField "String", "UPDATE_VERSION_URL", '"https://hljrsa.cn:50113/releases/ota/arch-public-version.json"'
            buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://hljrsa.cn:50113/releases/ota/arch-public-version.json"'
        }
        hyteraInternal {
            dimension "edition"
            applicationId "cn.arch.dmr.hytera"
            versionCode 821
            versionName "3.3.120-HYTERA-INTERNAL"
            manifestPlaceholders = [appLabel: "ARCH海能达版"]
            buildConfigField "boolean", "PUBLIC_EDITION", "false"
            buildConfigField "boolean", "HYTERA_EDITION", "true"
            buildConfigField "boolean", "OVERSEAS_EDITION", "false"
            buildConfigField "String", "APP_DISPLAY_TITLE", '"ARCH海能达版"'
            buildConfigField "String", "APP_EDITION_LABEL", '"海能达版"'
            buildConfigField "String", "DISPLAY_VERSION_LABEL", '"3.3.120（海能达版）"'
            buildConfigField "String", "UPDATE_VERSION_URL", '"https://hljrsa.cn:50113/releases/ota/arch-hytera-version.json"'
            buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://hljrsa.cn:50113/releases/ota/arch-hytera-version.json"'
        }
        overseas {
            dimension "edition"
            applicationId "cn.arch.dmr.overseas"
            versionCode 5
            versionName "1.0.4-OVERSEAS"
            manifestPlaceholders = [appLabel: "ARCH海外版"]
            buildConfigField "boolean", "PUBLIC_EDITION", "false"
            buildConfigField "boolean", "HYTERA_EDITION", "false"
            buildConfigField "boolean", "OVERSEAS_EDITION", "true"
            buildConfigField "String", "APP_DISPLAY_TITLE", '"ARCH海外版"'
            buildConfigField "String", "APP_EDITION_LABEL", '"海外版"'
            buildConfigField "String", "DISPLAY_VERSION_LABEL", '"1.0.4（海外版）"'
            buildConfigField "String", "UPDATE_VERSION_URL", '"https://arch-overseas.pages.dev/ota/arch-overseas-version.json"'
            buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://arch-overseas.pages.dev/ota/arch-overseas-version.json"'
        }
    }
    // externalNativeBuild { cmake { path "src/main/jni/CMakeLists.txt" } } // 用 jniLibs 预编译 so
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

androidComponents {
    onVariants(selector().withName("publicEditionRelease")) { variant ->
        // SIP is intentionally excluded from the public edition.
        variant.packaging.jniLibs.excludes.add("**/libpjsua2.so")
        variant.packaging.jniLibs.excludes.add("**/libc++_shared.so")
    }
}

dependencies {
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}































