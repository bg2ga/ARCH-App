apply plugin: 'com.android.application'
android {
    namespace 'cn.arch.dmr'
    compileSdk 34
    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 613
        versionName "3.2.81"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    flavorDimensions "edition"
    productFlavors {
        publicEdition {
            dimension "edition"
            applicationId "cn.arch.dmr.public"
            versionCode 660
            versionName "3.2.142-PUBLIC"
            manifestPlaceholders = [appLabel: "ARCH"]
            buildConfigField "boolean", "PUBLIC_EDITION", "true"
            buildConfigField "boolean", "HYTERA_EDITION", "false"
            buildConfigField "boolean", "OVERSEAS_EDITION", "false"
            buildConfigField "String", "APP_DISPLAY_TITLE", '"业余无线电融合中枢"'
            buildConfigField "String", "APP_EDITION_LABEL", '"公开版"'
            buildConfigField "String", "DISPLAY_VERSION_LABEL", '"3.2.142（公开版）"'
            buildConfigField "String", "UPDATE_VERSION_URL", '"https://hljrsa.cn:50113/releases/ota/arch-public-version.json"'
            buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://hljrsa.cn:50113/releases/ota/arch-public-version.json"'
        }
    }
    // externalNativeBuild { cmake { path "src/main/jni/CMakeLists.txt" } } // 用 jniLibs 预编译 so
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

androidComponents {
    onVariants(selector().withName("publicEditionRelease")) { variant ->
        // SIP is intentionally excluded from the public edition.
        variant.packaging.jniLibs.excludes.add("**/libpjsua2.so")
        variant.packaging.jniLibs.excludes.add("**/libc++_shared.so")
    }
}

dependencies {
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}































