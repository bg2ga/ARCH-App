apply plugin: 'com.android.application'

android {
    namespace 'cn.arch.dmr'
    compileSdk 34
    defaultConfig {
        applicationId "cn.arch.dmr.network"
        minSdk 21
        targetSdk 34
        versionCode 291
        versionName "1.3.30-NETWORK-PUBLIC-291-AUTOSTART-EXIT-95"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        buildConfigField "boolean", "PUBLIC_EDITION", "false"
        buildConfigField "boolean", "HYTERA_EDITION", "true"
        buildConfigField "String", "APP_DISPLAY_TITLE", '"ARCH公网版"'
        buildConfigField "String", "APP_EDITION_LABEL", '"公网版"'
        buildConfigField "String", "DISPLAY_VERSION_LABEL", '"1.3.30-NETWORK-PUBLIC-291-AUTOSTART-EXIT-95（公网版）"'
        buildConfigField "String", "UPDATE_VERSION_URL", '"https://hljrsa.cn:50113/releases/ota/arch-network-version.json"'
        buildConfigField "String", "UPDATE_FALLBACK_URL", '"https://hljrsa.cn:50113/releases/ota/arch-network-version.json"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging true }; resources { excludes += ["assets/md380/**"] } }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
}











// Hard regression gate for the repeatedly regressed PNC380 microphone mapping.
tasks.register('verifyPnc380MicRouting') {
    doLast {
        def required = [
            'src/main/java/cn/arch/dmr/AudioEngine.java': ['setPreferredInputDevice', 'rec.setPreferredDevice'],
            'src/main/java/cn/arch/dmr/MainActivity.java': [
                'findPnc380MainMic',
                'configureDmrMicDevice(dmrAudio)',
                'configureDmrMicDevice(bmAudio)',
                'network mic route=PNC380_MAIN'
            ],
            'src/main/java/cn/arch/dmr/SipPhoneActivity.java': ['applyInitialSipRoute', 'sip.setEarpiece()'],
            'src/main/java/cn/arch/dmr/SipClient.java': ['speaker+main-mic', 'earpiece+call-mic']
        ]
        required.each { path, needles ->
            def source = file(path)
            if (!source.exists()) throw new GradleException("Missing microphone source: ${path}")
            def text = source.getText('UTF-8')
            needles.each { needle ->
                if (!text.contains(needle)) {
                    throw new GradleException("PNC380 microphone regression guard failed: ${path} missing ${needle}")
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn verifyPnc380MicRouting }

// Regression gate for lock-screen volume routing and OS-driven reconnect.
tasks.register('verifyLockVolumeNetworkRecovery') {
    doLast {
        def required = [
            'src/main/java/cn/arch/dmr/NetworkRecovery.java': ['registerDefaultNetworkCallback', 'onNetworkRestored'],
            'src/main/java/cn/arch/dmr/MainActivity.java': [
                'startNetworkRecovery();',
                'reconnectModesAfterNetworkRestore',
                'ArchAppState.setActiveVolumeContext(mode, stream)',
                'dispatchOutputVolume',
                'syncVolumeControlStream();'
            ],
            'src/main/java/cn/arch/dmr/NetworkKeepAliveService.java': ['service mode=', 'activeVolumeStream', 'uiTrack='],
            'src/main/java/cn/arch/dmr/AudioEngine.java': ['setOutputVolume', 'applyOutputVolume'],
            'src/main/java/cn/arch/dmr/ArchAppState.java': ['setActiveVolumeContext'],
            'src/main/java/cn/arch/dmr/NetworkRuntime.java': ['NetworkRecovery.get(app).isOnline()'],
            'src/main/java/cn/arch/dmr/AprsClient.java': ['APRS-IS 等待系统网络恢复']
        ]
        required.each { path, needles ->
            def f = file(path)
            if (!f.exists()) throw new GradleException("Missing recovery source: ${path}")
            def text = f.getText('UTF-8')
            needles.each { needle ->
                if (!text.contains(needle)) throw new GradleException("Lock-volume/network regression: ${path} missing ${needle}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn verifyLockVolumeNetworkRecovery }
